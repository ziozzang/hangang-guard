name: Native binary qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'tools/prepare_release.py'
      - '.github/workflows/binaries.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'tools/prepare_release.py'
      - '.github/workflows/binaries.yml'

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      HANGANG_GUARD_BINARY: target/${{ matrix.target }}/release/sumunjang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add '${{ matrix.target }}'
      - name: Use physical temporary paths
        shell: bash
        run: python3 -c 'import os,tempfile; print("TMPDIR=" + os.path.realpath(tempfile.gettempdir()))' >> "$GITHUB_ENV"
      - name: Workspace tests
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --workspace --target '${{ matrix.target }}'
      - name: Release preparation tests
        run: python3 -m unittest discover -s tools -p test_prepare_release.py
      - name: Build native release binaries
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: CLI identity and read-only configuration check
        shell: bash
        run: |
          "$HANGANG_GUARD_BINARY" --about
          "$HANGANG_GUARD_BINARY" --version
          admin_token="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          collector_token="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export HANGANG_GUARD_ADMIN_TOKEN="$admin_token"
          export HANGANG_GUARD_COLLECTOR_TOKEN="$collector_token"
          "$HANGANG_GUARD_BINARY" --database "$RUNNER_TEMP/check-only.db" --check
          test ! -e "$RUNNER_TEMP/check-only.db"
      - name: Signed update process smoke
        if: runner.os == 'Linux'
        run: python3 tools/update_smoke.py --guard-bin "$HANGANG_GUARD_BINARY" --signer-bin "target/${{ matrix.target }}/release/guard-release-sign"
      - name: Prepare unsigned qualification assets
        run: python3 tools/prepare_release.py --unsigned --target '${{ matrix.target }}' --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangang-guard-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
