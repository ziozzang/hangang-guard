syntax = "proto3";
package hangang.sumunjang.v1;
service Network { rpc Check(NetworkRequest) returns (NetworkReply); }
message NetworkRequest { uint64 request_id = 1; bytes ip = 2; uint64 minimum_revision = 3; }
message NetworkReply {
 uint64 request_id = 1; uint64 revision = 2; Verdict verdict = 3;
 Mode mode = 4; uint32 ttl_ms = 5;
}
enum Verdict { VERDICT_UNSPECIFIED = 0; VERDICT_ALLOW = 1; VERDICT_DENY = 2; VERDICT_UNAVAILABLE = 3; }
enum Mode { MODE_UNSPECIFIED = 0; MODE_OBSERVE = 1; MODE_ENFORCE = 2; }
