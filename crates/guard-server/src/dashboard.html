<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>hangang-guard</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#101820;color:#eee}input,textarea,button{font:inherit;padding:.5rem;margin:.2rem}textarea{width:95%;min-height:16rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}section{border-top:1px solid #52616b;padding:1rem 0}</style><h1>hangang-guard</h1><p>Admin credential stays in this page's memory. Observe mode is the default; enforcement requires an explicit policy change.</p><input id="token" type="password" autocomplete="off" placeholder="Admin token"><button id="connect">Connect / refresh</button><pre id="message" role="status"></pre><section><h2>Status</h2><pre id="status"></pre></section><section><h2>Candidates</h2><div id="candidates"></div></section><section><h2>Policy</h2><textarea id="policy" aria-label="Policy JSON"></textarea><button id="save">Save policy</button></section><section><h2>Active blocks</h2><div id="blocks"></div></section><section><h2>Manual block</h2><input id="network" placeholder="192.0.2.0/24" aria-label="CIDR"><input id="ttl" type="number" value="900" min="1" aria-label="Lifetime seconds"><input id="reason" value="manual" maxlength="128" aria-label="Reason"><button id="add">Add block</button><button id="remove">Remove block</button></section><script>
let credential='';const el=id=>document.getElementById(id);const show=e=>el('message').textContent=String(e);
async function api(path,method='GET',body){const r=await fetch('/v1/'+path,{method,headers:{Authorization:'Bearer '+credential,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data;}
async function refresh(){el('status').textContent=JSON.stringify(await api('status'),null,2);el('policy').value=JSON.stringify(await api('policy'),null,2);const candidates=await api('candidates');el('candidates').replaceChildren();for(const c of candidates){const row=document.createElement('p'),text=document.createElement('span'),button=document.createElement('button');text.textContent=JSON.stringify(c)+' ';button.textContent=c.eligible?'Approve IP':'Observing';button.disabled=!c.eligible;button.onclick=()=>run(async()=>{await api('candidates/approve','POST',{ip:c.ip});await refresh();});row.append(text,button);el('candidates').append(row);}const blocks=await api('blocks');el('blocks').replaceChildren();for(const b of blocks){const row=document.createElement('p'),text=document.createElement('span'),button=document.createElement('button');text.textContent=b.network+' — expires '+new Date(b.expires_at*1000).toISOString()+' — '+b.reason+' ';button.textContent='Remove block';button.onclick=()=>run(async()=>{await api('blocks','DELETE',{network:b.network});await refresh();});row.append(text,button);el('blocks').append(row);}if(!blocks.length)el('blocks').textContent='No active blocks';show('Updated');}
async function run(f){try{await f();}catch(e){show(e.message);}}
el('connect').onclick=()=>run(async()=>{credential=el('token').value;el('token').value='';await refresh();});el('save').onclick=()=>run(async()=>{await api('policy','PUT',JSON.parse(el('policy').value));await refresh();});el('add').onclick=()=>run(async()=>{await api('blocks','POST',{network:el('network').value,expires_at:Math.floor(Date.now()/1000)+Number(el('ttl').value),reason:el('reason').value});await refresh();});el('remove').onclick=()=>run(async()=>{await api('blocks','DELETE',{network:el('network').value});await refresh();});
</script></html>
