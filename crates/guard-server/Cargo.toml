[package]
name = "guard-server"
default-run = "sumunjang"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sumunjang"
path = "src/main.rs"

# Compatibility executable for existing installations.
[[bin]]
name = "hangang-guard"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
maxminddb = { version = "0.32", default-features = false }
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
guard-core = { path = "../guard-core" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

guard-update = { path = "../guard-update" }
libc = "0.2"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"